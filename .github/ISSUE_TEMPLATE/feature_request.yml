# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Feature request
description: Suggest an enhancement for pain001-loader-xlsx
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
