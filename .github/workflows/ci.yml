name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          # pain001>=0.0.56 ships the pain001.plugins substrate that powers
          # this loader's entry-point auto-discovery.
          pip install "pain001>=0.0.56,<1"
          pip install -e ".[dev]"

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_loader_xlsx --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_loader_xlsx

  # release.yml refuses to publish without releases/v<version>.md, but it
  # only finds out after a tag has been pushed — which is how v0.1.0 failed
  # with "Release notes missing at releases/v0.1.0.md" on an already-public
  # tag. Same check, moved to where it costs a red PR instead of a bad tag.
  release-notes:
    name: Release Notes Present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every version must have release notes
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NOTE_PATH="releases/v${VERSION}.md"
          if [ ! -f "$NOTE_PATH" ]; then
            echo "::error::pyproject.toml declares ${VERSION} but ${NOTE_PATH} does not exist."
            echo "::error::release.yml requires it and will fail after the tag is pushed."
            exit 1
          fi
          echo "Found ${NOTE_PATH} for version ${VERSION}"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          # pain001>=0.0.56 ships the pain001.plugins substrate.
          pip install "pain001>=0.0.56,<1"
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check pain001_loader_xlsx/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check pain001_loader_xlsx/ tests/ examples/

      - name: Mypy
        run: mypy pain001_loader_xlsx/
