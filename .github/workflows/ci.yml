name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          # pain001>=0.0.56 ships the pain001.plugins substrate that powers
          # this loader's entry-point auto-discovery.
          pip install "pain001>=0.0.56,<1"
          pip install -e ".[dev]"

      - name: Run tests with 100% coverage gate
        run: |
          pytest tests/ \
            --cov=pain001_loader_xlsx --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_loader_xlsx

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pain001 + this package + dev tools
        run: |
          python -m pip install --upgrade pip
          # pain001>=0.0.56 ships the pain001.plugins substrate.
          pip install "pain001>=0.0.56,<1"
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check pain001_loader_xlsx/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check pain001_loader_xlsx/ tests/ examples/

      - name: Mypy
        run: mypy pain001_loader_xlsx/
