name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Hash-pinned install (OpenSSF Scorecard Pinned-Dependencies). The
      # package itself installs with --no-deps on top of the pinned tree,
      # which registers the pain001.loaders entry point the integration
      # tests discover.
      - name: Install dependencies (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/test.txt
          pip install --no-deps -e .

      - name: Run tests with 100% coverage gate
        run: |
          # --cov, --cov-branch and the 100% floor all come from
          # pyproject.toml, so a local `pytest` enforces exactly this.
          # Only the XML report is CI-specific.
          pytest tests/ --cov-report=xml -v

      - name: Canonical README is current
        run: python scripts/render_readme.py --check

      # Not a timing gate -- wall-clock is not comparable between
      # runners. This proves the benchmark still runs against the
      # current API rather than rotting into a file that reads as
      # verified and is not.
      - name: Run the benchmark
        run: python benches/bench_load_xlsx.py --quick

      - name: Enforce 100% docstring coverage
        run: interrogate -c pyproject.toml pain001_loader_xlsx

      # The scaling and memory guards compare the loader against itself,
      # so they do not depend on how fast this runner is.
      # --benchmark-json keeps the measurement as an artifact.
      - name: Benchmarks, scaling and memory guards
        run: |
          mkdir -p .benchmarks
          pytest tests/test_benchmarks.py -v --no-cov \
            --benchmark-json=.benchmarks/results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-py${{ matrix.python-version }}
          path: .benchmarks/

  # release.yml refuses to publish without releases/v<version>.md, but it
  # only finds out after a tag has been pushed — which is how v0.1.0 failed
  # with "Release notes missing at releases/v0.1.0.md" on an already-public
  # tag. Same check, moved to where it costs a red PR instead of a bad tag.
  release-notes:
    name: Release Notes Present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every version must have release notes
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version' pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          NOTE_PATH="releases/v${VERSION}.md"
          if [ ! -f "$NOTE_PATH" ]; then
            echo "::error::pyproject.toml declares ${VERSION} but ${NOTE_PATH} does not exist."
            echo "::error::release.yml requires it and will fail after the tag is pushed."
            exit 1
          fi
          echo "Found ${NOTE_PATH} for version ${VERSION}"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint tools (hash-pinned)
        run: pip install --require-hashes -r requirements/lint.txt

      - name: Ruff check
        run: ruff check pain001_loader_xlsx/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Ruff format check
        run: ruff format --check pain001_loader_xlsx/ tests/ examples/ benches/ scripts/ fuzz/

      - name: Mypy
        run: mypy pain001_loader_xlsx/ scripts/check_complexity.py scripts/check_suite_consistency.py

  # The native advisory audit over every hash-pinned requirements file, so
  # a published advisory against pain001, openpyxl or a tool fails the pull
  # request rather than waiting for a Dependabot alert.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (hash-pinned)
        run: pip install --require-hashes -r requirements/audit.txt

      - name: pip-audit
        run: |
          set -euo pipefail
          for f in requirements/*.txt; do
            echo "--- $f ---"
            pip-audit --progress-spinner off --require-hashes --disable-pip -r "$f"
          done

  # Per function: cyclomatic <= 10, cognitive <= 15, Halstead difficulty
  # <= 30, <= 60 lines; <= 500 lines per file. Offenders that predate the
  # gate live in complexity-baseline.json (empty today), which may only
  # shrink. tests/ is not measured: test_suite_conformance.py is vendored
  # from one canonical copy and checksummed, so it cannot be edited here.
  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install radon and complexipy (hash-pinned)
        run: pip install --require-hashes -r requirements/complexity.txt

      - name: Complexity
        run: |
          python scripts/check_complexity.py
          complexipy pain001_loader_xlsx scripts benches examples fuzz --max-complexity-allowed 15 --quiet
