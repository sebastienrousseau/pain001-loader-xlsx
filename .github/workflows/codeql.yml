# CodeQL, same shape as the pain001 core's workflow, minus the core's
# custom model pack (this repository has no path-validation sanitizer to
# register). The runtime tree is installed so CodeQL resolves imports.
name: 🔍 CodeQL Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC, offset from other scans

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Hash-pinned (OpenSSF Scorecard Pinned-Dependencies): the runtime
      # tree, then the package with --no-deps on top.
      - name: Install the package and its runtime tree (hash-pinned)
        run: |
          pip install --require-hashes -r requirements/runtime.txt
          pip install --no-deps -e .

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
          setup-python-dependencies: false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          fail-on: error
